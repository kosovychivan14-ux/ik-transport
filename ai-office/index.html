<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#06080c;font-family:'Segoe UI',system-ui,sans-serif;}
  #stage{position:fixed;inset:0;}
  #title{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#67e8f9;font-size:18px;font-weight:700;letter-spacing:3px;text-shadow:0 0 12px #22d3ee88;pointer-events:none;z-index:5;}
  #journal{position:fixed;top:10px;left:10px;width:250px;max-height:40vh;overflow:hidden;background:#0b0f16cc;border:1px solid #22d3ee55;border-radius:10px;padding:8px 10px;color:#c9d4e3;font-size:12px;z-index:5;backdrop-filter:blur(4px);}
  #journal h4{margin:0 0 6px;color:#67e8f9;font-size:12px;letter-spacing:1px;}
  #journal div{margin:2px 0;opacity:.9;}

  #agentPanel{position:fixed;top:10px;right:10px;width:300px;max-height:70vh;overflow-y:auto;background:#0b0f16cc;border:1px solid #22d3ee55;border-radius:10px;padding:8px;z-index:5;backdrop-filter:blur(4px);}

  .arow .nm{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arow .st{font-size:11px;opacity:.75;}
  .arow .sch{font-size:10px;opacity:.55;display:block;}
  #controls{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5;}
  #controls button{background:#0b0f16dd;border:1px solid #22d3ee66;color:#67e8f9;font-size:14px;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:600;}
  #controls button:hover{background:#22d3ee22;}
  #controls button.on{background:#22d3ee33;border-color:#22d3ee;}
  #hint{position:fixed;bottom:14px;left:14px;color:#5b6b82;font-size:11px;z-index:5;pointer-events:none;}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ РЕАЛЬНІ АГЕНТИ (як у v4) ============ */
const AGENTS=[
 {id:'agents-morning-report', short:'morning-report', color:0xd7f924, css:'#d7f924', female:false, sched:'щодня 09:45',
  desc:'Ранковий звіт агентів: статуси всіх процесів.', pc:['збирає статуси агентів','будує віджет-звіт'], chat:['звіти зібрані ✓','всі на місцях']},
 {id:'daily-briefing', short:'daily-briefing', color:0x22d3ee, css:'#22d3ee', female:false, sched:'щодня 09:23',
  desc:'Щоденний брифінг: головне за добу.', pc:['пише денний брифінг','малює PNG-картку'], chat:['брифінг готовий','картка намальована']},
 {id:'threads-morning-viral-digest', short:'threads-digest', color:0xa78bfa, css:'#a78bfa', female:true, sched:'щодня 07:23',
  desc:'Дайджест вірусних постів Threads + 3 чернетки.', pc:['сканує вірусні пости','пише 3 чернетки'], chat:['чернетки готові','вірусне знайшла']},
 {id:'instagram-watch-artemnesterenko', short:'insta-watch', color:0xf472b6, css:'#f472b6', female:true, sched:'щодня 09:23',
  desc:'Моніторинг нових постів @artemnesterenko.', pc:['моніторить @artemnesterenko','збирає нові пости'], chat:['Нестеренко постить','новий пост є']},
 {id:'budget-daily-watch', short:'budget-watch', color:0x34d399, css:'#34d399', female:false, sched:'щодня 08:23',
  desc:'Контроль витрат на платні API.', pc:['звіряє витрати API','перевіряє spend guard'], chat:['бюджет в нормі','spend guard ок']},
 {id:'api-keys-watch', short:'api-keys', color:0xfb923c, css:'#fb923c', female:true, sched:'щодня 08:23',
  desc:'Аудит API-ключів у CRM.', pc:['аудитить API-ключі','шукає НЕ ПІДТВЕРДЖЕНО'], chat:['ключі чисті','все підтверджено']},
 {id:'tg-inbox-watch', short:'tg-inbox', color:0x60a5fa, css:'#60a5fa', female:true, sched:'кожні 10 хв',
  desc:'Перевірка вхідних Telegram.', pc:['читає вхідні TG','перевіряє групу'], chat:['вхідні пусті','тихо в групі']},
 {id:'github-watch-webinar', short:'github-watch', color:0xe5e7eb, css:'#e5e7eb', female:false, sched:'щогодини',
  desc:'Вотчер репозиторіїв webinar / k-transport.', pc:['стежить за репозиторіями','ловить нові коміти'], chat:['комітів нема','репо чисті']},
 {id:'reels-research-weekly', short:'reels-research', color:0xc084fc, css:'#c084fc', female:true, sched:'щопонеділка 08:23',
  desc:'Ресерч вірусних тем для рілсів.', pc:['шукає вірусні теми','аналізує тренди'], chat:['теми знайшла','тренди гарячі']},
 {id:'budget-monthly-ask', short:'budget-ask', color:0xfbbf24, css:'#fbbf24', female:false, sched:'щомісяця 1-го',
  desc:'Місячний запит бюджету.', pc:['готує місячний запит','рахує ліміти'], chat:['ліміти пораховано']},
 {id:'tg-scheduler', short:'tg-scheduler', color:0x2dd4bf, css:'#2dd4bf', female:false, sched:'за розкладом постів',
  desc:'Заплановані TG-публікації.', pc:['публікує TG-пости','готує тексти й картинки'], chat:['пости за розкладом','все опублікую']},
];
const FIRST_WAVE=4;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ============ СЦЕНА ============ */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06080c);
scene.fog=new THREE.Fog(0x06080c,60,140);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,300);
camera.position.set(2,16,34);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(6,1,0);
controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=6; controls.maxDistance=70;
controls.autoRotate=true; controls.autoRotateSpeed=0.5;
controls.addEventListener('start',()=>{controls.autoRotate=false;});

/* Світло */
scene.add(new THREE.HemisphereLight(0xbdd7ff,0x2a1f14,0.55));
const sun=new THREE.DirectionalLight(0xfff2e0,1.35);
sun.position.set(15,25,18); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-30; sun.shadow.camera.right=30; sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30;
scene.add(sun);
const cyan1=new THREE.PointLight(0x22d3ee,30,25); cyan1.position.set(-6,3.4,0); scene.add(cyan1);
const cyan2=new THREE.PointLight(0x22d3ee,30,25); cyan2.position.set(17,3.4,0); scene.add(cyan2);

/* ============ ТЕКСТУРИ (canvas) ============ */
function canvasTex(w,h,fn){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  fn(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const woodFloorTex=canvasTex(512,512,(c,w,h)=>{
  c.fillStyle='#9a6b42'; c.fillRect(0,0,w,h);
  for(let i=0;i<8;i++){
    c.fillStyle=i%2?'#a4764a':'#93643c'; c.fillRect(0,i*64,w,62);
    c.fillStyle='#00000033'; c.fillRect(0,i*64,w,2);
    for(let k=0;k<4;k++){c.fillStyle='#00000022';c.fillRect(Math.random()*w,i*64+6+Math.random()*50,60+Math.random()*80,2);}
  }
});
woodFloorTex.wrapS=woodFloorTex.wrapT=THREE.RepeatWrapping; woodFloorTex.repeat.set(8,5);
const woodWallTex=canvasTex(512,256,(c,w,h)=>{
  c.fillStyle='#7d5533'; c.fillRect(0,0,w,h);
  for(let i=0;i<6;i++){c.fillStyle=i%2?'#8a5f39':'#75502f'; c.fillRect(i*86,0,84,h);
    c.fillStyle='#00000044'; c.fillRect(i*86,0,2,h);}
});
woodWallTex.wrapS=woodWallTex.wrapT=THREE.RepeatWrapping; woodWallTex.repeat.set(3,1);

/* Матеріали */
const M={
  white:new THREE.MeshStandardMaterial({color:0xf2f4f6,roughness:.35,metalness:.1}),
  chrome:new THREE.MeshStandardMaterial({color:0x3a4150,roughness:.35,metalness:.85}),
  dark:new THREE.MeshStandardMaterial({color:0x14181f,roughness:.5,metalness:.4}),
  wood:new THREE.MeshStandardMaterial({map:woodFloorTex,roughness:.7}),
  woodWall:new THREE.MeshStandardMaterial({map:woodWallTex,roughness:.75}),
  wall:new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:.85}),
  holo:new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false}),
  glow:new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:.9}),
};

/* Панель з текстом (для голограм) */
function makePanel(w,h,px,py){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(px,py),
    new THREE.MeshBasicMaterial({map:tx,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
  mesh.renderOrder=20;
  const P={cv,ctx:cv.getContext('2d'),tx,mesh,
    draw(fn){const c=this.ctx;c.clearRect(0,0,w,h);fn(c,w,h);this.tx.needsUpdate=true;}};
  return P;
}
function holoFrame(c,w,h,css){
  const g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0e3a46ee'); g.addColorStop(1,'#08222bee');
  c.fillStyle=g; c.beginPath(); c.roundRect(2,2,w-4,h-4,18); c.fill();
  c.strokeStyle=css||'#22d3ee'; c.lineWidth=4; c.beginPath(); c.roundRect(2,2,w-4,h-4,18); c.stroke();
}

/* ============ БУДІВЛЯ: зал + лаунж (стиль «AI Agents Home») ============ */
const HALL={x0:-14,x1:6,z0:-8,z1:8}, LOUNGE={x0:8,x1:26,z0:-8,z1:8}, DOOR_Z=0, DOOR_W=3;
const world=new THREE.Group(); scene.add(world);
function box(w,h,d,mat,x,y,z,parent,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); if(shadow){m.castShadow=true;m.receiveShadow=true;}
  (parent||world).add(m); return m;
}
/* Підлога */
const floorHall=new THREE.Mesh(new THREE.PlaneGeometry(HALL.x1-HALL.x0,HALL.z1-HALL.z0),M.wood);
floorHall.rotation.x=-Math.PI/2; floorHall.position.set((HALL.x0+HALL.x1)/2,0,(HALL.z0+HALL.z1)/2);
floorHall.receiveShadow=true; world.add(floorHall);
const floorLounge=floorHall.clone(); floorLounge.scale.x=(LOUNGE.x1-LOUNGE.x0)/(HALL.x1-HALL.x0);
floorLounge.position.x=(LOUNGE.x0+LOUNGE.x1)/2; world.add(floorLounge);
/* Зовнішня земля */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x0a0e14,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.02; world.add(ground);
/* Стіни */
const WALL_H=3.4;
box(HALL.x1-HALL.x0,WALL_H,0.3,M.wall,(HALL.x0+HALL.x1)/2,WALL_H/2,HALL.z0-0.15);           // зал задня
box(0.3,WALL_H,HALL.z1-HALL.z0,M.wall,HALL.x0-0.15,WALL_H/2,0);                              // зал ліва
box(LOUNGE.x1-LOUNGE.x0,WALL_H,0.3,M.wall,(LOUNGE.x0+LOUNGE.x1)/2,WALL_H/2,LOUNGE.z0-0.15);   // лаунж задня
box(0.3,WALL_H,LOUNGE.z1-LOUNGE.z0,M.woodWall,LOUNGE.x1+0.15,WALL_H/2,0);                    // лаунж права (дерево)
/* Перегородка з дверима */
const seg1=(HALL.z0+DOOR_Z-DOOR_W/2), seg2=(DOOR_Z+DOOR_W/2+HALL.z1);
box(0.3,WALL_H,Math.abs(seg1),M.wall,6,WALL_H/2,(HALL.z0+DOOR_Z-DOOR_W/2)/2);
box(0.3,WALL_H,Math.abs(seg2),M.wall,6,WALL_H/2,(DOOR_Z+DOOR_W/2+HALL.z1)/2);
box(0.3,WALL_H-2.5,DOOR_W,M.wall,6,(WALL_H+2.5)/2,DOOR_Z);                                   // перемичка над дверима
/* Дверний портал — ціанова рамка */
const doorGlow=box(0.1,2.5,DOOR_W+0.5,new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:.25}),6,1.25,DOOR_Z,world,false);
doorGlow.material.side=THREE.DoubleSide;
/* Стеля (за замовчуванням прихована — вид «ляльковий будиночок»; кнопка «Дах» вмикає) */
const ceilings=[
box(HALL.x1-HALL.x0,0.2,HALL.z1-HALL.z0,new THREE.MeshStandardMaterial({color:0x11161d,roughness:.9}),(HALL.x0+HALL.x1)/2,4.4,0),
box(LOUNGE.x1-LOUNGE.x0,0.2,LOUNGE.z1-LOUNGE.z0,new THREE.MeshStandardMaterial({color:0x151009,roughness:.9}),(LOUNGE.x0+LOUNGE.x1)/2,4.4,0)];
ceilings.forEach(c=>c.visible=false);
/* Шестикутні лампи */
function hexLamp(x,z){
  const g=new THREE.Group(); g.position.set(x,4.4,z);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,3.6),M.chrome); rod.position.y=1.5; g.add(rod);
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.7,0.35,6),
    new THREE.MeshStandardMaterial({color:0x222a33,roughness:.4,metalness:.7}));
  shade.position.y=-0.75; g.add(shade);
  const bulb=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.06,6),
    new THREE.MeshBasicMaterial({color:0xaef3ff}));
  bulb.position.y=-0.95; g.add(bulb);
  world.add(g);
}
for(let x=-11;x<=3;x+=3.5){hexLamp(x,-3.5);hexLamp(x,3.5);}
for(let x=11;x<=24;x+=4){hexLamp(x,-3.5);hexLamp(x,3.5);}
/* Ціанові схемні лінії на підлозі */
function floorLine(x1,z1,x2,z2){
  const len=Math.hypot(x2-x1,z2-z1);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(len,0.12),
    new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:.35}));
  m.rotation.x=-Math.PI/2; m.rotation.z=-Math.atan2(z2-z1,x2-x1);
  m.position.set((x1+x2)/2,0.015,(z1+z2)/2); world.add(m);
}
floorLine(-13,0,5,0); floorLine(5,0,7.5,0); floorLine(7.5,0,25,0);
for(let x=-11;x<=3;x+=3.5)floorLine(x,0,x,6.5);
/* Вивіска AI AGENTS HOME у залі */
const hallSign=makePanel(1024,160,10,1.0);
hallSign.draw((c,w,h)=>{holoFrame(c,w,h);
  c.fillStyle='#67e8f9';c.font='bold 72px sans-serif';c.textAlign='center';
  c.fillText('🥥 AI AGENTS HOME',w/2,h/2+26);});
hallSign.mesh.position.set(-4,3.85,-7.8); world.add(hallSign.mesh);

/* ============ ГОЛОГРАФІЧНІ СТАНЦІЇ ЗАЛУ ============ */
const DESKS=[];
for(let i=0;i<6;i++)DESKS.push({x:-11+i*2,y:0,z:-3.2,face:0});       // задній ряд
for(let i=0;i<5;i++)DESKS.push({x:-10+i*2,y:0,z:2.6,face:Math.PI});  // передній ряд
const deskScreens=[];
DESKS.forEach((d,i)=>{
  const g=new THREE.Group(); g.position.set(d.x,0,d.z); world.add(g);
  const top=box(1.7,0.09,0.95,M.chrome,0,0.78,0,g);
  box(1.5,0.7,0.8,M.dark,0,0.38,0,g);
  const legL=box(0.08,0.78,0.08,M.chrome,-0.7,0.39,0,g);
  const legR=box(0.08,0.78,0.08,M.chrome,0.7,0.39,0,g);
  /* голографічний екран над столом */
  const scr=makePanel(512,300,1.5,0.88);
  scr.mesh.position.set(0,1.55,0); scr.mesh.rotation.x=-0.18; g.add(scr.mesh);
  const beam=new THREE.Mesh(new THREE.ConeGeometry(0.7,1.1,4,1,true),M.holo.clone());
  beam.position.set(0,1.05,0); beam.rotation.y=Math.PI/4; g.add(beam);
  /* стілець */
  const ch=new THREE.Group(); ch.position.set(0,0,d.face===0?1.25:-1.25); ch.rotation.y=d.face; g.add(ch);
  box(0.5,0.08,0.5,M.dark,0,0.5,0,ch);
  box(0.5,0.6,0.08,M.dark,0,0.85,-0.24,ch);
  box(0.07,0.5,0.07,M.chrome,-0.18,0.25,0,ch); box(0.07,0.5,0.07,M.chrome,0.18,0.25,0,ch);
  deskScreens.push({scr,desk:d,idx:i});
});
/* Великий дашборд cron engine */
const dash=makePanel(1024,420,7,2.9);
dash.mesh.position.set(-4,1.8,-7.82); world.add(dash.mesh);
box(7.4,3.3,0.15,M.dark,-4,1.8,-7.95);

/* ============ ЛАУНЖ ============ */
const LOUNGE_SPOTS={coffee:{x:22,z:-4.5},couch:{x:16,z:4.2},table:{x:16,z:1.8},dog:[{x:11,z:-2},{x:20,z:5},{x:24,z:2},{x:13,z:-6}]};
/* Неонова вивіска */
const loungeSign=makePanel(1400,220,11,1.7);
loungeSign.draw((c,w,h)=>{
  c.fillStyle='#120c06ee'; c.beginPath(); c.roundRect(2,2,w-4,h-4,24); c.fill();
  c.strokeStyle='#22d3ee'; c.lineWidth=5; c.beginPath(); c.roundRect(2,2,w-4,h-4,24); c.stroke();
  c.fillStyle='#67e8f9'; c.font='bold 74px sans-serif'; c.textAlign='center';
  c.shadowColor='#22d3ee'; c.shadowBlur=24;
  c.fillText('AI AGENTS HOME',w/2,92); c.fillText('☕ COFFEE & COMPUTE',w/2,172);});
loungeSign.mesh.position.set(25.8,2.6,0); loungeSign.mesh.rotation.y=-Math.PI/2; world.add(loungeSign.mesh);
/* Диван */
(function(){
  const g=new THREE.Group(); g.position.set(16,0,5.2); g.rotation.y=Math.PI; world.add(g);
  const fab=new THREE.MeshStandardMaterial({color:0x8a5a35,roughness:.8});
  box(3.4,0.45,1.2,fab,0,0.45,0,g);
  box(3.4,0.9,0.35,fab,0,0.9,-0.55,g);
  box(0.35,0.75,1.2,fab,-1.7,0.6,0,g); box(0.35,0.75,1.2,fab,1.7,0.6,0,g);
  box(0.7,0.35,0.9,new THREE.MeshStandardMaterial({color:0x22d3ee,roughness:.8}),-0.9,0.85,0.05,g);
  box(0.7,0.35,0.9,new THREE.MeshStandardMaterial({color:0xd7f924,roughness:.8}),0.9,0.85,0.05,g);
})();
/* Дерев'яний столик з кавою і круасаном */

/* ============ РОБОТ (стиль референсу: білий округлий корпус, темні суглоби) ============ */
function makeRobot(def){
  const g=new THREE.Group();
  const R={g,def,phase:Math.random()*10,eyeColor:def?def.color:0x22d3ee};
  const jointM=new THREE.MeshStandardMaterial({color:0x23272e,roughness:.4,metalness:.7});
  const bodyM=new THREE.MeshStandardMaterial({color:0xf2f4f6,roughness:.32,metalness:.08});
  if(def&&def.female) bodyM.color.set(0xf8f6f2);
  function part(geo,mat,x,y,z,parent){const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z); m.castShadow=true; (parent||g).add(m); return m;}
  /* Ноги з суглобами (півот у стегні) */
  function leg(sx){
    const hip=new THREE.Group(); hip.position.set(sx*0.17,0.98,0); g.add(hip);
    part(new THREE.SphereGeometry(0.1,10,10),jointM,0,0,0,hip);
    part(new THREE.CylinderGeometry(0.075,0.065,0.42,10),bodyM,0,-0.24,0,hip);
    part(new THREE.SphereGeometry(0.075,10,10),jointM,0,-0.47,0,hip);      // коліно
    part(new THREE.CylinderGeometry(0.06,0.055,0.4,10),bodyM,0,-0.68,0,hip);
    const foot=part(new THREE.BoxGeometry(0.16,0.1,0.3),jointM,0,-0.9,0.06,hip);
    return hip;
  }
  R.legL=leg(-1); R.legR=leg(1);
  /* Таз + торс */
  part(new THREE.SphereGeometry(0.2,12,12),bodyM,0,1.02,0);
  const torso=part(new THREE.CapsuleGeometry(0.27,0.42,6,14),bodyM,0,1.42,0);
  if(def&&def.female) torso.scale.set(0.88,1,0.82);                          // вужчий силует
  part(new THREE.BoxGeometry(0.2,0.28,0.02),jointM,0,1.45,0.26);              // темна грудна панель
  const chestDot=part(new THREE.SphereGeometry(0.045,10,10),
    new THREE.MeshBasicMaterial({color:R.eyeColor}),0,1.5,0.28);            // індикатор кольору агента
  R.chestDot=chestDot;
  /* Руки-маніпулятори (півот у плечі) */
  function arm(sx){
    const sh=new THREE.Group(); sh.position.set(sx*0.34,1.62,0); g.add(sh);
    part(new THREE.SphereGeometry(0.09,10,10),jointM,0,0,0,sh);
    part(new THREE.CylinderGeometry(0.065,0.055,0.34,10),bodyM,0,-0.2,0,sh);
    part(new THREE.SphereGeometry(0.06,10,10),jointM,0,-0.4,0,sh);           // лікоть
    part(new THREE.CylinderGeometry(0.05,0.045,0.3,10),bodyM,0,-0.56,0,sh);
    part(new THREE.SphereGeometry(0.07,10,10),jointM,0,-0.74,0,sh);          // кисть
    return sh;
  }
  R.armL=arm(-1); R.armR=arm(1);
  R.armL.rotation.z=0.12; R.armR.rotation.z=-0.12;
  /* Голова + візор + очі */
  const headG=new THREE.Group(); headG.position.set(0,1.92,0); g.add(headG); R.head=headG;
  part(new THREE.SphereGeometry(0.23,18,16),bodyM,0,0,0,headG);
  const visor=part(new THREE.SphereGeometry(0.19,18,14,Math.PI*1.15,Math.PI*0.7,Math.PI*0.28,Math.PI*0.44),
    new THREE.MeshStandardMaterial({color:0x0c1016,roughness:.15,metalness:.6}),0,0.01,0.055,headG);
  visor.scale.set(1,0.85,0.75);
  const eyeM=new THREE.MeshBasicMaterial({color:R.eyeColor});
  const eyeG=new THREE.SphereGeometry(0.035,10,10);
  R.eyeL=part(eyeG,eyeM,-0.075,0.02,0.20,headG);
  R.eyeR=part(eyeG,eyeM,0.075,0.02,0.20,headG);
  /* Статеві ознаки */
  if(def&&def.female){
    part(new THREE.SphereGeometry(0.1,12,12),   // пучок-зачіска
      new THREE.MeshStandardMaterial({color:0x3a2c22,roughness:.7}),0,0.16,-0.18,headG);
    part(new THREE.BoxGeometry(0.3,0.05,0.06),   // волосся ззаду
      new THREE.MeshStandardMaterial({color:0x3a2c22,roughness:.7}),0,0.02,-0.2,headG);
    const lashM=new THREE.MeshBasicMaterial({color:0x111111});
    part(new THREE.BoxGeometry(0.05,0.012,0.01),lashM,-0.075,0.055,0.205,headG); // вії
    part(new THREE.BoxGeometry(0.05,0.012,0.01),lashM,0.075,0.055,0.205,headG);
  }else{
    part(new THREE.BoxGeometry(0.09,0.3,0.03),   // краватка
      new THREE.MeshStandardMaterial({color:0x1c2733,roughness:.5}),0,1.32,0.28);
    const ant=part(new THREE.CylinderGeometry(0.012,0.012,0.22),jointM,0.14,2.2,0);
    part(new THREE.SphereGeometry(0.03,8,8),new THREE.MeshBasicMaterial({color:R.eyeColor}),0.14,2.32,0);
  }
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  return R;
}
/* Поза/анімація робота */
function animRobot(R,dt,t,mode){
  const w=mode==='walk';
  if(w){
    const s=Math.sin(t*R.walkFreq+R.phase), c2=Math.cos(t*R.walkFreq+R.phase);
    R.legL.rotation.x=s*0.62; R.legR.rotation.x=-s*0.62;
    R.armL.rotation.x=-s*0.42; R.armR.rotation.x=s*0.42;
    R.g.position.y=R.baseY+Math.abs(c2)*0.055;
    R.head.rotation.y=Math.sin(t*0.7+R.phase)*0.12;
  }else if(mode==='type'){
    R.legL.rotation.x*=0.9; R.legR.rotation.x*=0.9;
    R.armL.rotation.x=-0.85+Math.sin(t*17+R.phase)*0.1;
    R.armR.rotation.x=-0.85+Math.sin(t*17+R.phase+Math.PI)*0.1;
    R.head.rotation.x=0.28; R.head.rotation.y*=0.95;
    R.g.position.y+=(R.baseY-R.g.position.y)*0.2;
  }else if(mode==='sip'){
    R.armR.rotation.x=-1.5+Math.sin(t*2)*0.06; R.armL.rotation.x=-0.3;
    R.head.rotation.x=-0.22; R.g.position.y+=(R.baseY-R.g.position.y)*0.2;
  }else if(mode==='relax'){
    R.armL.rotation.x=-0.2; R.armR.rotation.x=-0.2; R.armL.rotation.z=0.35; R.armR.rotation.z=-0.35;
    R.head.rotation.y=Math.sin(t*0.5+R.phase)*0.3; R.head.rotation.x=-0.1;
    R.g.position.y=R.baseY+Math.sin(t*1.4+R.phase)*0.015;
  }else{ /* idle */
    R.legL.rotation.x*=0.9; R.legR.rotation.x*=0.9;
    R.armL.rotation.x*=0.9; R.armR.rotation.x*=0.9;
    R.head.rotation.y=Math.sin(t*0.4+R.phase)*0.25; R.head.rotation.x*=0.95;
    R.g.position.y=R.baseY+Math.sin(t*1.6+R.phase)*0.02;
  }
}

function billboardToCam(R,mesh){
  R.g.getWorldQuaternion(_pq).invert();

}

  const g=new THREE.Group();
  const wm=new THREE.MeshStandardMaterial({color:0xf4f6f8,roughness:.5});
  const bm=new THREE.MeshStandardMaterial({color:0x22262d,roughness:.5});

    m.position.set(x,y,z); m.castShadow=true; (parent||g).add(m); return m;}
  const body=part(new THREE.SphereGeometry(0.42,14,12),wm,0,0,0);
  body.scale.set(1.5,0.85,0.85);
  part(new THREE.CylinderGeometry(0.09,0.13,0.75,10),wm,0.6,0.28,0).rotation.z=-0.7;
  const headG=new THREE.Group(); headG.position.set(0.92,0.52,0); g.add(headG);
  part(new THREE.SphereGeometry(0.15,12,10),wm,0,0,0,headG);
  const beak=part(new THREE.ConeGeometry(0.06,0.42,10),new THREE.MeshStandardMaterial({color:0xe8853d,roughness:.5}),0.32,0,0,headG);
  beak.rotation.z=-Math.PI/2;
  const eyeM=new THREE.MeshBasicMaterial({color:0x111111});
  part(new THREE.SphereGeometry(0.025,8,8),eyeM,0.06,0.05,0.1,headG);
  part(new THREE.SphereGeometry(0.025,8,8),eyeM,0.06,0.05,-0.1,headG);
  const wings=[];
  for(const s of [1,-1]){
    const piv=new THREE.Group(); piv.position.set(0.05,0.25,s*0.3); g.add(piv);
    const wmesh=part(new THREE.BoxGeometry(1.15,0.05,0.55),s>0?wm:bm,0.55,0,s*0.28,piv);
    wmesh.rotation.y=s*0.25;

  part(new THREE.CylinderGeometry(0.03,0.03,0.7,8),new THREE.MeshStandardMaterial({color:0xe8853d}),-0.5,-0.35,0.12).rotation.x=0.15;
  part(new THREE.CylinderGeometry(0.03,0.03,0.7,8),new THREE.MeshStandardMaterial({color:0xe8853d}),-0.5,-0.35,-0.12).rotation.x=-0.15;
  return {g,wings,phase:Math.random()*9};

  /* базікають з сусідом */
  const mate=agents.find(b=>b!==A&&b.state==='break'&&
    b.R.g.position.distanceTo(A.R.g.position)<4&&Math.random()<0.6);
  if(mate){
    const t1=pick(A.def.chat), t2=pick(mate.def.chat);
    chatBubble(A.R,'«'+t1+'»',3); setTimeout(()=>chatBubble(mate.R,'«'+t2+'»',3),900/timeScale);
    log('💬 '+A.def.short+' ↔ '+mate.def.short);
  }
}
function backToWork(A){
  A.R.baseY=0; A.pose='walk';
  A.state='toWork';
  A.way=pathThroughDoor(A.R.g.position.x,A.R.g.position.z,
    A.desk.x,A.desk.z+(A.desk.face===0?1.25:-1.25));
  setStatus(A.idx,'йде');
}
function updateAgent(A,dt,t){
  const R=A.R;
  if(A.way.length){
    const wp=A.way[0], dx=wp.x-R.g.position.x, dz=wp.z-R.g.position.z;
    const dist=Math.hypot(dx,dz), sp=1.5*R.speedMul*timeScale*dt;
    if(dist<Math.max(0.08,sp)){R.g.position.x=wp.x; R.g.position.z=wp.z; A.way.shift();
      if(!A.way.length){
        if(A.state==='toWork')arriveDesk(A);
        else if(A.state==='toBreak')arriveBreak(A);
      }
    }else{
      R.g.position.x+=dx/dist*sp; R.g.position.z+=dz/dist*sp;
      const ta=Math.atan2(dx,dz); let da=ta-R.g.rotation.y;
      while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
      R.g.rotation.y+=da*Math.min(1,dt*8);
      animRobot(R,dt,t,'walk');
      billboardToCam(A.R,A.holo.mesh);
      return;
    }
  }
  if(A.state==='work'){
    A.t+=dt*timeScale; A.prog=Math.min(1,A.t/A.dur);
    R.g.rotation.y+=(A.faceDesk-R.g.rotation.y)*Math.min(1,dt*4);
    animRobot(R,dt,t,'type');
    if(A.t>=A.dur)goBreak(A);
  }else if(A.state==='break'){
    A.t+=dt*timeScale;
    if(A.pose==='sit'){
      R.legL.rotation.x=-1.45; R.legR.rotation.x=-1.45;
      R.armL.rotation.x=-0.25; R.armR.rotation.x=-0.25;
      R.armL.rotation.z=0.4; R.armR.rotation.z=-0.4;
      R.head.rotation.y=Math.sin(t*0.5+R.phase)*0.35;
      R.g.position.y=R.baseY+Math.sin(t*1.3+R.phase)*0.015;
    }else animRobot(R,dt,t,A.pose==='sip'?'sip':'relax');
    if(A.t>=A.dur)backToWork(A);
  }else{
    animRobot(R,dt,t,'idle');
  }
  billboardToCam(A.R,A.holo.mesh);
}
/* Живі підписи */
let holoTick=0;
function updateHolos(){
  for(const A of agents){
    const online=A.state!=='idle';
    A.holo.redraw(A.task,A.prog,online);
  }
  deskScreens.forEach(ds=>{
    const A=ds.desk.busy;
    ds.scr.draw((c,w,h)=>{
      holoFrame(c,w,h,A?A.def.css:'#1c2733');
      c.textAlign='left';
      if(A){
        c.fillStyle=A.def.css; c.font='bold 38px sans-serif';
        c.fillText(A.def.short,24,58);
        c.fillStyle='#aef3ff'; c.font='32px sans-serif';
        c.fillText('▸ '+A.task.slice(0,26),24,108);
        c.fillStyle='#0b2b33'; c.fillRect(24,140,w-48,40);
        c.fillStyle=A.def.css; c.fillRect(24,140,(w-48)*A.prog,40);
        c.fillStyle='#dff6ff'; c.font='bold 30px sans-serif'; c.textAlign='right';
        c.fillText(Math.round(A.prog*100)+'%',w-24,172);
      }else{
        c.fillStyle='#3b4a5c'; c.font='bold 40px sans-serif';
        c.fillText('STANDBY',24,80);
        c.fillStyle='#24303d'; c.font='30px sans-serif';
        c.fillText('вільна станція',24,140);
      }
    });
  });
}
let dashTick=0;
function updateDash(){
  const online=agents.filter(a=>a.state!=='idle').length;
  const working=agents.filter(a=>a.state==='work').length;
  const brk=agents.filter(a=>a.state==='break').length;
  dash.draw((c,w,h)=>{
    holoFrame(c,w,h);
    c.fillStyle='#67e8f9'; c.font='bold 52px sans-serif'; c.textAlign='left';
    c.fillText('⚙ CRON ENGINE · SYNCED',36,72);
    c.font='bold 40px sans-serif'; c.fillStyle='#aef3ff';
    c.fillText('● '+online+'/11 ONLINE   💻 '+working+' працюють   ☕ '+brk+' на перерві',36,140);
    let y=182;
    for(const def of AGENTS){
      const a=agents.find(a=>a.def===def);
      c.fillStyle='#3b4a5c'; c.fillRect(36,y,w-72,18);
      if(a){
        const gr=c.createLinearGradient(36,0,w-36,0);
        gr.addColorStop(0,'#22d3ee'); gr.addColorStop(1,def.css);
        c.fillStyle=gr; c.fillRect(36,y,(w-72)*(a.state==='work'?a.prog:a.state==='break'?1:0.15),18);
        c.fillStyle='#dff6ff'; c.font='17px sans-serif'; c.fillText(def.short,44,y+15);
      }else{
        c.fillStyle='#5b6b82'; c.font='17px sans-serif'; c.fillText(def.short+' — ⏳',44,y+15);
      }
      y+=21;
    }
  });
}

/* ============ РОБОПЕС ============ */
const dog=makeDog(); world.add(dog.g);
let dogWay=[{x:11,z:-2}], dogT=0;
function updateDog(dt,t){
  const wp=dogWay[0], dx=wp.x-dog.g.position.x, dz=wp.z-dog.g.position.z;
  const dist=Math.hypot(dx,dz);
  if(dist<0.15){dogWay=[pick(LOUNGE_SPOTS.dog)];dogT=0;}
  else{
    const sp=1.1*timeScale*dt;
    dog.g.position.x+=dx/dist*sp; dog.g.position.z+=dz/dist*sp;
    const ta=Math.atan2(dx,dz); let da=ta-dog.g.rotation.y;
    while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
    dog.g.rotation.y+=da*Math.min(1,dt*6);
    dogT+=dt*timeScale*10;
    dog.legs.forEach((l,i)=>{l.rotation.x=Math.sin(dogT+i*Math.PI)*0.55;});
    dog.g.position.y=Math.abs(Math.sin(dogT))*0.04;
  }
  dog.tail.rotation.x=Math.sin(t*9)*0.5; dog.tail.rotation.z=0.4+Math.sin(t*9)*0.2;
}

/* ============ ЛЕЛЕКА: доставка ============ */
let storkBusy=false;
async function deliverStork(){
  if(storkBusy)return;
  if(!storkQueue.length){log('🪶 усі агенти вже в офісі');return;}
  storkBusy=true;
  const idx=AGENTS.indexOf(storkQueue.shift());
  log('🪶 лелека летить з новим агентом…');
  const S=makeStork(); world.add(S.g);
  const from=new THREE.Vector3(-28,10,-16), hover=new THREE.Vector3(-1,6,4.5), out=new THREE.Vector3(30,10,16);
  async function flyTo(p,dur){
    const start=S.g.position.clone(), t0=performance.now();
    while(true){
      const k=Math.min(1,(performance.now()-t0)/(dur*1000/timeScale));
      S.g.position.lerpVectors(start,p,k*k*(3-2*k));
      S.g.position.y+=Math.sin(performance.now()/300)*0.008;
      const d=new THREE.Vector3().subVectors(p,start);
      if(d.lengthSq()>0.01)S.g.rotation.y=Math.atan2(d.x,d.z)-Math.PI/2;
      if(k>=1)break; await wait(30);
    }
  }
  S.g.position.copy(from);
  const flap=setInterval(()=>{
    const s=Math.sin(performance.now()/160);
    S.wings.forEach(w=>{w.piv.rotation.x=w.s*s*0.75;});
  },30);
  await flyTo(hover,3.2);
  log('🪶 лелека скидає агента…');
  const A=spawnAgent(idx,hover.x,hover.z);
  const grow=setInterval(()=>{
    const k=Math.min(1,(performance.now()-A.birth)/1200);
    A.R.g.scale.setScalar(0.05+0.95*k);
    if(k>=1){clearInterval(grow);A.R.g.scale.setScalar(1);}
  },30);
  await wait(1400); await flyTo(out,3);
  clearInterval(flap); world.remove(S.g);
  storkBusy=false; log('🪶 лелека полетів');
}

/* ============ UI ============ */
document.getElementById('btnStork').onclick=deliverStork;
document.getElementById('btnRoof').onclick=e=>{
  const on=!ceilings[0].visible;
  ceilings.forEach(c=>c.visible=on);
  e.target.classList.toggle('on',on);
  log(on?'🏠 дах показано':'🏠 дах приховано — вид зверху');
};
document.getElementById('btnAgents').onclick=e=>{
  const p=document.getElementById('agentPanel');
  p.style.display=p.style.display==='none'?'block':'none';
  e.target.classList.toggle('on');
};
document.getElementById('btnPause').onclick=e=>{
  paused=!paused; e.target.textContent=paused?'▶ Старт':'⏸ Пауза'; e.target.classList.toggle('on',paused);
  log(paused?'⏸ пауза':'▶ продовжуємо');
};
const speeds=[1,2,4]; let spdI=0;
document.getElementById('btnSpeed').onclick=e=>{
  spdI=(spdI+1)%speeds.length; timeScale=speeds[spdI];
  e.target.textContent='⏩ '+timeScale+'×';
};
let focusT=null;
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ============ СТАРТ ============ */
for(let i=0;i<FIRST_WAVE;i++)spawnAgent(i);
dog.g.position.set(11,0,-2);
log('🏢 3D-офіс відкрито: зал + лаунж');
log('🪶 натисни «Лелека!», щоб привести решту агентів');
updateHolos(); updateDash();

/* ============ ГОЛОВНИЙ ЦИКЛ ============ */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,clock.getDelta()), t=clock.elapsedTime;
  if(!paused){
    for(const A of agents)updateAgent(A,dt,t);
    updateDog(dt,t);
    steamPuffs.forEach(s=>{
      s.userData.t+=dt*timeScale*0.5;
      if(s.userData.t>1)s.userData.t=0;
      const k=s.userData.t;
      s.position.y=0.55+k*0.9;
      s.material.opacity=0.35*(1-k);
      const sc=0.5+k*1.4; s.scale.set(sc,sc,sc);
    });
    holoTick+=dt; if(holoTick>0.5){holoTick=0;updateHolos();}
    dashTick+=dt; if(dashTick>1){dashTick=0;updateDash();}
    for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];
      billboardToCam(b.R,b.mesh);
      if(t>b.until){b.R.g.remove(b.mesh);bubbles.splice(i,1);}}
  }
  if(focusT){controls.target.lerp(focusT,0.08);
    if(controls.target.distanceTo(focusT)<0.1)focusT=null;}
  controls.update();
  renderer.render(scene,camera);
}
loop();
</script>
